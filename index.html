<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Дорожные края</title>
    <meta name="description" content="Дорожные края — браузерная стратегия вдоль большого тракта. Люди живут в жилье, каждая работа занимает человека. Одиночная игра, кампания и сеть." />
    <meta name="theme-color" content="#1c1612" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Дорожные края" />
    <meta property="og:title" content="Дорожные края" />
    <meta property="og:description" content="Стратегия вдоль большого тракта: люди, жильё, дороги и соседи. Можно играть одному, пройти кампанию или сесть за сетевой стол." />
    <meta property="og:url" content="https://sania2007mav.github.io/road-realms/" />
    <meta property="og:image" content="https://sania2007mav.github.io/road-realms/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Дорожные края" />
    <meta name="twitter:description" content="Стратегия вдоль большого тракта: люди, жильё, дороги и соседи." />
    <meta name="twitter:image" content="https://sania2007mav.github.io/road-realms/og.png" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      (function () {
        var touch = navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches;
        var land = touch && window.matchMedia('(orientation: landscape)').matches && window.matchMedia('(max-height: 500px)').matches;
        if (land) document.documentElement.classList.add('phone-land');
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="boot" data-testid="boot">
        <p class="boot-title">Дорожные края</p>
        <div id="boot-bar" aria-hidden="true"><i></i></div>
        <p>Загрузка</p>
      </div>
      <canvas id="world"></canvas>
      <header id="topbar"></header>
      <aside id="goals" data-testid="goals" hidden></aside>
      <div id="tip" hidden></div>
      <div id="banner" hidden></div>
      <aside id="panel" hidden></aside>
      <aside id="army" hidden>
        <button type="button" id="army-box" data-testid="army-box" aria-pressed="false">Выделить войска</button>
        <div id="army-groups" data-testid="army-groups">
          <button type="button" class="army-group" data-group="1" data-testid="group-1">1</button>
          <button type="button" class="army-group" data-group="2" data-testid="group-2">2</button>
          <button type="button" class="army-group" data-group="3" data-testid="group-3">3</button>
        </div>
        <div id="army-body" hidden>
          <p id="army-count" data-testid="army-count"></p>
          <div id="army-actions">
            <button type="button" id="army-hold" data-testid="army-hold">Стоять</button>
            <button type="button" id="army-home" data-testid="army-home">Назад домой</button>
            <button type="button" id="army-clear" data-testid="army-clear">Распустить выделение</button>
            <button type="button" id="army-attack" data-testid="army-attack" aria-pressed="false">Атаковать область</button>
          </div>
          <p id="army-hint" data-testid="army-hint" hidden></p>
        </div>
      </aside>
      <footer id="dock">
        <div id="phone-goal" data-testid="phone-goal" hidden></div>
        <div id="log"></div>
        <div id="toast" hidden></div>
        <div id="hint" data-testid="hint" hidden></div>
        <div id="speeds"></div>
        <div id="buildbar"></div>
        <div id="econ"></div>
        <div id="dock-nav">
          <button id="home" type="button" data-testid="focus-home">К себе</button>
          <button id="map-toggle" type="button" data-testid="map-toggle">Карта</button>
        </div>
        <div id="mapwrap"><canvas id="minimap"></canvas></div>
      </footer>
      <div id="land-tray" data-testid="land-tray">
        <div id="land-speeds-slot"></div>
        <div id="land-row">
          <button type="button" id="land-full" data-testid="land-full" hidden>Экран</button>
        </div>
      </div>
      <div id="place-confirm" data-testid="place-confirm" hidden>
        <button type="button" id="place-ok" data-testid="place-ok" aria-label="Поставить">✓</button>
        <button type="button" id="place-cancel" data-testid="place-cancel" aria-label="Отмена">✕</button>
      </div>
      <div id="event-note" data-testid="event-note" hidden>
        <span id="event-note-text"></span>
        <button type="button" id="event-show" data-testid="event-show">показать</button>
      </div>
      <div id="caravan-box" data-testid="caravan-box" hidden>
        <h2>Караван</h2>
        <p id="caravan-stock" data-testid="caravan-stock"></p>
        <div class="turn-actions">
          <button type="button" id="caravan-buy" data-testid="caravan-buy">Купить дерево</button>
          <button type="button" id="caravan-sell" data-testid="caravan-sell">Продать яблоки</button>
          <button type="button" id="caravan-sack" data-testid="caravan-sack">Напасть</button>
        </div>
      </div>
      <div id="turn-hint" data-testid="turn-hint" hidden>
        <p>Поверните телефон для удобства</p>
        <div class="turn-actions">
          <button type="button" id="turn-full" data-testid="turn-full">Во весь экран</button>
          <button type="button" id="turn-dismiss" data-testid="turn-dismiss">Понятно</button>
        </div>
      </div>
      <section id="net" hidden></section>
      <section id="syncbox" hidden></section>
      <section id="title"></section>
      <section id="about" data-testid="about" hidden></section>
      <section id="crash" data-testid="crash" hidden>
        <div class="card">
          <h2>Что-то пошло не так</h2>
          <p>Партия на этом устройстве сохранена, если автосохранение успело записаться. Сеть для этого не нужна.</p>
          <p id="crash-detail"></p>
          <div class="actions">
            <button type="button" id="crash-recover" data-testid="crash-recover">Продолжить с сохранения</button>
            <button type="button" id="crash-menu" data-testid="crash-menu">На заставку</button>
          </div>
        </div>
      </section>
      <section id="update-banner" data-testid="update-banner" hidden>
        <p>Доступна новая версия</p>
        <button type="button" id="update-apply" data-testid="update-apply">Обновить</button>
      </section>
      <section id="install-banner" data-testid="install-banner" hidden>
        <p>Установить «Дорожные края» на это устройство</p>
        <button type="button" id="install-apply" data-testid="install-apply">Установить</button>
        <button type="button" id="install-dismiss" data-testid="install-dismiss">Не сейчас</button>
      </section>
      <section id="tutorial" hidden></section>
      <section id="end" hidden></section>
      <section id="menu" hidden></section>
      <section id="help-book" data-testid="help-book" hidden></section>
      <section id="achieve-book" data-testid="achieve-book" hidden></section>
      <section id="stats-book" data-testid="stats-book" hidden></section>
      <section id="settings-panel" data-testid="settings-panel" hidden></section>
      <section id="save-panel" data-testid="save-panel" hidden></section>
      <section id="popbox" hidden></section>
      <section id="peoplebox" hidden></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
